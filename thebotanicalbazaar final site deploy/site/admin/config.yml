backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "products"
    label: "Product Listings"
    folder: "content/products"
    create: true
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Price", name: "price", widget: "number" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Stock / Availability", name: "stock", widget: "string" }
      - { label: "Description", name: "description", widget: "markdown" }

  - name: "consultations"
    label: "Consultations"
    folder: "content/consultations"
    create: true
    fields:
      - { label: "Service Title", name: "title", widget: "string" }
      - { label: "Duration & Price", name: "details", widget: "string" }
      - { label: "Description", name: "body", widget: "markdown" }

  - name: "almanac"
    label: "The Almanac"
    folder: "content/almanac"
    create: true
    fields:
      - { label: "Entry Title", name: "title", widget: "string" }
      - { label: "Season / Date", name: "date", widget: "datetime" }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    fields:
      - { label: "Event Name", name: "title", widget: "string" }
      - { label: "Event Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Event Details", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Site Pages"
    files:
      - file: "content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Headline", name: "hero_title", widget: "string" }
          - { label: "Hero Subtext", name: "hero_subtitle", widget: "text" }
      - file: "content/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "About Headline", name: "title", widget: "string" }
          - { label: "About Bio", name: "body", widget: "markdown" }
